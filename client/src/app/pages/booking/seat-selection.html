<div class="container page">
  @if (loading()) {
    <app-loading-spinner label="Loading seats…" />
  } @else if (error(); as message) {
    <div class="alert alert-error">{{ message }}</div>
    <a class="btn btn-outline btn-sm" routerLink="/movies">Back to movies</a>
  } @else {
    <div class="flow">
      @if (showtime(); as current) {
        <a class="back-link text-sm" [routerLink]="['/movies', current.movie.id]">← Back to {{ current.movie.title }}</a>

        <app-show-summary
          [posterUrl]="current.movie.posterUrl"
          [title]="current.movie.title"
          [dateTime]="current.showDateTime"
          [theatre]="current.theater.name"
          [format]="current.format"
          [language]="current.language"
          [showSeats]="false"
        />
      }

      <section class="map-card">
        <h2 class="label">Choose up to {{ maxTickets }} seats</h2>

        @if (seatMap(); as map) {
          <div class="seat-map-wrapper" (click)="onSeatMapClick($event)">
            <app-seat-map
              [seatMap]="map"
              [(selected)]="selected"
              [maxSelection]="maxTickets"
              (selectionChange)="onSelectionChange($event)"
            />
          </div>
        } @else {
          <app-empty-state icon="💺" title="Seat map unavailable" message="Please refresh the page." />
        }
      </section>

      <section class="bar">
        <button type="button" class="btn btn-block btn-lg" [disabled]="!quantity()" (click)="proceed()">
          @if (quantity() > 0) {
            Proceed to checkout · {{ quantity() }} seat{{ quantity() === 1 ? '' : 's' }}
          } @else {
            Select seats to continue
          }
        </button>
      </section>
    </div>
  }
</div>
