<div class="container page">
  <header class="page-head">
    <div>
      <h1>Sell your tickets</h1>
      <p class="subtitle">
        Life happens. List seats you cannot use and recover up to 95% of the price — ThiraiHub keeps a
        5% seller fee.
      </p>
    </div>
    <a class="wallet-card" routerLink="/wallet" aria-label="Open your wallet">
      <svg class="wallet-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3M4 7.5V17a2 2 0 0 0 2 2h12.5a1.500 1.500 0 0 0 1.500-1.500v-8A1.500 1.500 0 0 0 18.500 8H6.500A2.500 2.500 0 0 1 4 5.500M16 13.500h.01" />
      </svg>
      <span class="wallet-text">
        <span class="wallet-label">Wallet</span>
        <strong class="wallet-amount">{{ wallet.balance() | inr }}</strong>
      </span>
      <svg class="wallet-go" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </a>
  </header>

  <nav class="seg-tabs" aria-label="Selling">
    <a routerLink="/sell" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Ready to sell</a>
    <a routerLink="listings" routerLinkActive="active">
      Your listings
      <span class="tab-count">{{ store.stats().active }}</span>
    </a>
  </nav>

  <router-outlet />
</div>
