  @if (loading()) {
    <app-loading-spinner label="Loading your bookings…" />
  } @else {
    <div class="sell-grid">
      <section class="panel">
        <div class="panel-title">Pick a booking to sell</div>

        @if (eligibleBookings().length === 0) {
          <app-empty-state
            icon="🎫"
            title="No upcoming tickets to sell"
            message="Only upcoming, completed bookings that are not already listed can be resold. Book a show first."
          >
            <a class="btn btn-sm" routerLink="/movies">Browse movies</a>
          </app-empty-state>
        } @else {
          <div class="stack-sm">
            @for (booking of eligibleBookings(); track booking.id) {
              <button
                type="button"
                class="booking-option"
                [class.too-close]="isTooClose(booking)"
                [disabled]="isTooClose(booking)"
                (click)="open(booking)"
              >
                <app-film-thumb [posterUrl]="booking.showtime.movie.posterUrl" [alt]="booking.showtime.movie.title" />

                <div class="option-copy">
                  <span class="option-head">
                    <strong class="option-title">{{ booking.showtime.movie.title }}</strong>
                    <span class="when" [class.soon]="isSoon(booking)">{{ startsIn(booking) }}</span>
                  </span>
                  <span class="option-meta">
                    <span class="venue">{{ booking.showtime.theater.name }}</span>
                    <span class="meta-when">· {{ booking.showtime.showDateTime | showDate }} | {{ booking.showtime.showDateTime | showTime }}</span>
                  </span>
                  <span class="option-seats" [attr.aria-label]="booking.unlistedSeats.length + ' seats'">
                    @for (seat of booking.unlistedSeats; track seat) {
                      <span class="mini-seat">{{ seat }}</span>
                    }
                  </span>
                </div>

                <div class="option-aside">
                  @if (isTooClose(booking)) {
                    <span class="too-close-note">Too close to showtime to list</span>
                  } @else {
                    <span class="recover">
                      <span class="recover-label">You get up to</span>
                      <strong>{{ recoverable(booking) | inr }}</strong>
                    </span>
                  }
                </div>

              </button>
            }
          </div>
        }
      </section>
    </div>
  }
